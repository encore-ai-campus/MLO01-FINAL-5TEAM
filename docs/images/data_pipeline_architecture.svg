<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1200" width="1240" height="1200" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" fill="#1F2937">
  <defs>
    <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="ahP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1200" fill="#FFFFFF"/>
  <text x="30" y="28" font-size="15" font-weight="700">데이터 파이프라인 구조</text>

  <!-- 1행: 데이터 준비 -->
  <rect fill="#EEEEF2" stroke="#6B7280" stroke-width="1.5" x="40" y="50" width="180" height="50" rx="8"/>
  <text x="130" y="80" text-anchor="middle" font-weight="700" font-size="13.5">원본 CSV</text>
  <path fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ahG)" d="M220,75 H385"/>
  <text x="302" y="67" text-anchor="middle" font-size="11.5" fill="#374151">변환(이벤트 ID 부여)</text>
  <rect fill="#EEEEF2" stroke="#6B7280" stroke-width="1.5" x="390" y="45" width="240" height="60" rx="8"/>
  <text x="510" y="70" text-anchor="middle" font-weight="700" font-size="13.5">원본 기록(Parquet)</text>
  <text x="510" y="90" text-anchor="middle" font-size="11.5" fill="#374151">공용 표본 / 전체</text>
  <path fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ahG)" d="M510,105 V138"/>

  <!-- 2행: 화면 서버, 재생기, API -->
  <rect fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5" x="80" y="140" width="220" height="56" rx="8"/>
  <text x="190" y="164" text-anchor="middle" font-weight="700" font-size="13.5">화면 서버</text>
  <text x="190" y="184" text-anchor="middle" font-size="11.5" fill="#374151">데모 화면의 행동</text>

  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="370" y="140" width="280" height="56" rx="8"/>
  <text x="510" y="164" text-anchor="middle" font-weight="700" font-size="13.5">로그 재생기</text>
  <text x="510" y="184" text-anchor="middle" font-size="11.5" fill="#374151">재생 시계 발행(실행 ID·재생 시각)</text>

  <path fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ahP)" d="M650,168 H878"/>
  <text x="764" y="160" text-anchor="middle" font-size="11.5" fill="#6D28D9">재생 중 추천 요청(사용자 10%)</text>
  <text x="764" y="186" text-anchor="middle" font-size="11.5" fill="#6D28D9">반환 목록은 재생기가 기록</text>

  <rect fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5" x="880" y="140" width="240" height="56" rx="8"/>
  <text x="1000" y="164" text-anchor="middle" font-weight="700" font-size="13.5">추천·구매 전환 예측 API</text>
  <text x="1000" y="184" text-anchor="middle" font-size="11.5" fill="#374151">(FastAPI)</text>

  <!-- 3행: Kafka -->
  <rect fill="#F7F7FA" stroke="#6B7280" stroke-width="1.2" x="370" y="232" width="790" height="98" rx="10"/>
  <text x="384" y="251" font-weight="700" font-size="13">Kafka</text>
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M510,196 V258"/>
  <text x="518" y="226" font-size="11.5" fill="#1D4ED8">재생 행동</text>
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M190,196 V276 H388"/>
  <text x="198" y="226" font-size="11.5" fill="#1D4ED8">화면 행동</text>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="390" y="260" width="240" height="56" rx="8"/>
  <text x="510" y="283" text-anchor="middle" font-weight="700" font-size="13.5">행동 토픽</text>
  <text x="510" y="303" text-anchor="middle" font-size="11.5" fill="#374151">조회·장바구니·구매</text>
  <path fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ahP)" d="M1000,196 V258"/>
  <rect fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5" x="860" y="260" width="280" height="56" rx="8"/>
  <text x="1000" y="283" text-anchor="middle" font-weight="700" font-size="13.5">피드백 토픽</text>
  <text x="1000" y="303" text-anchor="middle" font-size="11.5" fill="#374151">노출·클릭(화면 서버)·예측 기록(API)</text>

  <!-- 4행: 판정 작업, 피드백 적재 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M510,316 V368"/>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="360" y="370" width="300" height="64" rx="8"/>
  <text x="510" y="396" text-anchor="middle" font-weight="700" font-size="13.5">Spark 판정 작업</text>
  <text x="510" y="418" text-anchor="middle" font-size="11.5" fill="#374151">형식 검사 → 중복·늦음 판정(결과를 붙여 모두 내보냄)</text>

  <path fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ahP)" d="M1000,316 V368"/>
  <rect fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5" x="860" y="370" width="280" height="64" rx="8"/>
  <text x="1000" y="396" text-anchor="middle" font-weight="700" font-size="13.5">Spark 피드백 적재 작업</text>
  <text x="1000" y="418" text-anchor="middle" font-size="11.5" fill="#374151">중복 제거 후 적재(수 분 이내)</text>

  <!-- 4.5행: 정제 토픽 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M510,434 V468"/>
  <rect fill="#F7F7FA" stroke="#6B7280" stroke-width="1.5" x="390" y="470" width="240" height="56" rx="8"/>
  <text x="510" y="494" text-anchor="middle" font-weight="700" font-size="13.5">Kafka 정제 토픽</text>
  <text x="510" y="514" text-anchor="middle" font-size="11.5" fill="#374151">판정 결과를 붙인 행동</text>

  <!-- 피드백 Delta -->
  <path fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ahP)" d="M1000,434 V468"/>
  <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.5" x="860" y="470" width="280" height="56" rx="8"/>
  <text x="1000" y="494" text-anchor="middle" font-weight="700" font-size="13.5">Delta Lake</text>
  <text x="1000" y="514" text-anchor="middle" font-size="11.5" fill="#374151">피드백 테이블</text>

  <!-- 행동 토픽 → Delta 적재(원본 복사) -->
  <path fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahB)" d="M390,304 H300 V564"/>
  <text x="292" y="420" text-anchor="end" font-size="11.5" fill="#1D4ED8">원본 복사</text>

  <!-- 5행: 두 소비 작업 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M450,526 V546 H380 V564"/>
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M570,526 V546 H690 V564"/>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="120" y="566" width="360" height="64" rx="8"/>
  <text x="300" y="592" text-anchor="middle" font-weight="700" font-size="13.5">Spark Delta 적재 작업</text>
  <text x="300" y="614" text-anchor="middle" font-size="11.5" fill="#374151">30~60초마다 모아 쓰기(멱등 쓰기)</text>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="570" y="566" width="240" height="64" rx="8"/>
  <text x="690" y="592" text-anchor="middle" font-weight="700" font-size="13.5">Spark Redis 반영 작업</text>
  <text x="690" y="614" text-anchor="middle" font-size="11.5" fill="#374151">수 초 간격</text>

  <!-- 예측 요청 경로 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M810,598 H858"/>
  <text x="834" y="590" text-anchor="middle" font-size="10.5" fill="#1D4ED8">먼저 씀</text>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="860" y="570" width="280" height="56" rx="8"/>
  <text x="1000" y="593" text-anchor="middle" font-weight="700" font-size="13.5">Kafka 예측 요청 토픽</text>
  <text x="1000" y="613" text-anchor="middle" font-size="11.5" fill="#374151">예측 대상 행동마다 입력을 실음</text>
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M1000,626 V664"/>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="860" y="666" width="280" height="56" rx="8"/>
  <text x="1000" y="689" text-anchor="middle" font-weight="700" font-size="13.5">예측 요청 처리 작업</text>
  <text x="1000" y="709" text-anchor="middle" font-size="11.5" fill="#374151">저장 또는 실패 토픽 쓰기 확인 뒤 위치 기록</text>
  <path fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ahP)" d="M1140,694 H1180 V182 H1122"/>
  <text x="1172" y="452" text-anchor="end" font-size="11.5" fill="#6D28D9" transform="rotate(-90 1172 452)">예측 요청 → API</text>

  <!-- API → PostgreSQL 예측 저장 -->
  <path fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ahP)" d="M1120,152 H1200 V818 H1142"/>
  <text x="1212" y="480" text-anchor="middle" font-size="11.5" fill="#6D28D9" transform="rotate(90 1212 480)">구매 전환 예측 API가 계산해 저장</text>

  <!-- 6행: 저장소 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M300,630 V694"/>
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M690,630 V694"/>
  <text x="700" y="668" font-size="11.5" fill="#1D4ED8">예측 요청을 쓴 뒤 반영</text>

  <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.5" x="120" y="696" width="360" height="104" rx="8"/>
  <text x="300" y="720" text-anchor="middle" font-weight="700" font-size="13.5">Delta Lake</text>
  <text x="136" y="743" font-size="11.5" fill="#374151">원본(bronze): 모든 이벤트 그대로</text>
  <text x="136" y="764" font-size="11.5" fill="#374151">정제(silver): 판정 결과 포함</text>
  <text x="136" y="785" font-size="11.5" fill="#374151">피처(gold): 피처 이력, 직접 만든 시점 조회 함수</text>

  <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.5" x="536" y="696" width="308" height="104" rx="8"/>
  <text x="690" y="720" text-anchor="middle" font-weight="700" font-size="13.5">Redis</text>
  <text x="690" y="743" text-anchor="middle" font-size="11.5" fill="#374151">온라인 피처 스토어</text>
  <text x="690" y="764" text-anchor="middle" font-size="11.5" fill="#374151">세션 피처·최근 행동 5개·현재 세션 기록(처리 위치)</text>
  <text x="690" y="785" text-anchor="middle" font-size="11.5" fill="#374151">구매 이력(실시간), 사용자·상품 피처(배치)</text>

  <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.5" x="860" y="770" width="280" height="96" rx="8"/>
  <text x="1000" y="794" text-anchor="middle" font-weight="700" font-size="13.5">PostgreSQL</text>
  <text x="1000" y="816" text-anchor="middle" font-size="11.5" fill="#374151">예측 기록</text>
  <text x="1000" y="836" text-anchor="middle" font-size="11.5" fill="#374151">상품 이력 표(사본), 상품 관계표</text>
  <text x="1000" y="856" text-anchor="middle" font-size="11.5" fill="#374151">사용자 계정</text>

  <!-- 7행: 배치 -->
  <path fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ahO)" d="M240,800 V864"/>
  <text x="232" y="836" text-anchor="end" font-size="11.5" fill="#9A3412">정제 읽기</text>
  <path fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ahO)" d="M360,864 V802"/>
  <text x="368" y="836" font-size="11.5" fill="#9A3412">피처 이력 쓰기</text>

  <rect fill="#FFEFD9" stroke="#D98A1F" stroke-width="1.5" x="120" y="866" width="360" height="84" rx="8"/>
  <text x="300" y="891" text-anchor="middle" font-weight="700" font-size="13.5">Airflow 배치 작업(Spark 배치)</text>
  <text x="300" y="913" text-anchor="middle" font-size="11.5" fill="#374151">일 단위 집계 피처, 상품 이력 사본, 품질 검증,</text>
  <text x="300" y="933" text-anchor="middle" font-size="11.5" fill="#374151">드리프트, 추천 성능 지표 집계</text>

  <path fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ahO)" d="M480,908 H690 V802"/>
  <text x="500" y="898" font-size="11.5" fill="#9A3412">사용자·상품 피처</text>
  <text x="500" y="928" font-size="11.5" fill="#9A3412">하루 경계까지 처리가 끝나면 실행</text>

  <!-- 상품 이력 사본 -->
  <path fill="none" stroke="#C2410C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahO)" d="M440,950 V972 H1000 V868"/>
  <text x="760" y="965" text-anchor="middle" font-size="11.5" fill="#9A3412">상품 이력 사본(열·키 정의는 데이터 담당, 적재는 서빙 담당)</text>

  <!-- 8행: 모니터링 -->
  <path fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ahG)" d="M300,950 V994"/>
  <rect fill="#EEEEF2" stroke="#6B7280" stroke-width="1.5" x="120" y="996" width="360" height="56" rx="8"/>
  <text x="300" y="1029" text-anchor="middle" font-weight="700" font-size="13.5">Prometheus 지표 → Grafana 대시보드·알림</text>

  <!-- 범례 -->
  <rect fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" x="560" y="996" width="580" height="160" rx="8"/>
  <text x="576" y="1018" font-weight="700" font-size="12.5">범례</text>
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M576,1042 H626"/>
  <text x="638" y="1046" font-size="11.5">실시간 경로(판정 → 정제 토픽 → 두 작업, 예측 요청)</text>
  <path fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ahO)" d="M576,1068 H626"/>
  <text x="638" y="1072" font-size="11.5">배치 경로(하루 단위)</text>
  <path fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ahP)" d="M576,1094 H626"/>
  <text x="638" y="1098" font-size="11.5">서빙 경로(API 호출, 피드백 → 적재)</text>
  <path fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ahG)" d="M576,1120 H626"/>
  <text x="638" y="1124" font-size="11.5">데이터 준비·모니터링</text>
  <path fill="none" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" d="M860,1120 H910"/>
  <text x="922" y="1124" font-size="11.5">점선 = 사본(원본 복사·상품 이력)</text>
  <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.2" x="576" y="1136" width="14" height="10" rx="2"/>
  <text x="598" y="1145" font-size="11">초록 상자: 저장소</text>

  <!-- 주석 -->
  <text x="40" y="1182" font-size="11.5" fill="#374151">배치 피처는 Feast 없이 피처 정의 파일·시점 조회 함수·Redis 갱신을 직접 만든다. 구성 요소를 어느 클러스터·PC에 두는지는 시스템 구조도를 따른다.</text>
</svg>
