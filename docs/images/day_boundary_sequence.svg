<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="1140" height="760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" fill="#1F2937">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1140" height="760" fill="#FFFFFF"/>
  <text x="30" y="28" font-size="15" font-weight="700">하루 경계 처리 순서(재생 시각이 하루 경계를 넘을 때)</text>

  <!-- 단계 띠 -->
  <rect x="20" y="118" width="1100" height="128" fill="#F3F7FD"/>
  <rect x="20" y="246" width="1100" height="104" fill="#FFFFFF"/>
  <rect x="20" y="350" width="1100" height="92" fill="#F3F7FD"/>
  <rect x="20" y="442" width="1100" height="196" fill="#FFFFFF"/>
  <rect x="20" y="638" width="1100" height="70" fill="#F3F7FD"/>

  <!-- 참여자 -->
  <g font-weight="700" font-size="13.5" text-anchor="middle">
    <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="80" y="50" width="140" height="44" rx="8"/><text x="150" y="77">재생기</text>
    <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="250" y="50" width="140" height="44" rx="8"/><text x="320" y="77">Kafka</text>
    <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="420" y="50" width="140" height="44" rx="8"/><text x="490" y="77">Spark 스트리밍</text>
    <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.5" x="590" y="50" width="140" height="44" rx="8"/><text x="660" y="77">Delta Lake</text>
    <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.5" x="760" y="50" width="140" height="44" rx="8"/><text x="830" y="72">Redis</text>
    <rect fill="#FFEFD9" stroke="#D98A1F" stroke-width="1.5" x="930" y="50" width="140" height="44" rx="8"/><text x="1000" y="77">Airflow</text>
  </g>
  <text x="830" y="88" text-anchor="middle" font-size="10.5" fill="#374151">시계 키 · 피처 키</text>

  <!-- 생명선 -->
  <g stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 4">
    <path d="M150,94 V720"/><path d="M320,94 V720"/><path d="M490,94 V720"/>
    <path d="M660,94 V720"/><path d="M830,94 V720"/><path d="M1000,94 V720"/>
  </g>

  <!-- 재생기 일시정지 구간 -->
  <rect x="143" y="150" width="14" height="510" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <text x="138" y="410" text-anchor="end" font-size="11.5" fill="#92400E">일시정지</text>

  <!-- 0: 직전 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#ahB)" d="M150,112 H318"/>
  <text x="234" y="106" text-anchor="middle" font-size="11.5" fill="#1D4ED8">전날 이벤트 전송</text>

  <!-- 1 -->
  <circle cx="44" cy="138" r="13" fill="#1F2937"/><text x="44" y="143" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
  <text x="166" y="146" font-size="11.5">하루 경계에서 일시정지</text>
  <path fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)" d="M157,182 H828"/>
  <text x="490" y="176" text-anchor="middle" font-size="11.5">시계 키에 상태(일시정지)와 그때까지 보낸 Kafka 파티션별 마지막 위치(오프셋) 기록</text>

  <path fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#ahB)" d="M320,214 H488"/>
  <text x="404" y="208" text-anchor="middle" font-size="11.5" fill="#1D4ED8">남은 전날 이벤트</text>
  <path fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#ahB)" d="M490,224 H658"/>
  <path fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#ahB)" d="M490,224 V236 H828"/>
  <text x="668" y="229" font-size="11" fill="#1D4ED8">처리·반영 중</text>

  <!-- 2 -->
  <circle cx="44" cy="266" r="13" fill="#1F2937"/><text x="44" y="271" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
  <rect x="470" y="262" width="620" height="54" rx="6" fill="#FFEFD9" stroke="#D98A1F" stroke-width="1.2"/>
  <text x="780" y="284" text-anchor="middle" font-size="11.5" fill="#9A3412">Airflow 센서: 기록된 위치까지 Spark가 처리를 마치고 Delta와 Redis에 반영했는가 확인</text>
  <text x="780" y="304" text-anchor="middle" font-size="11.5" fill="#9A3412">(시계가 아니라 처리 완료를 확인. 확인 방법은 구현 때 정한다)</text>
  <text x="746" y="340" text-anchor="middle" font-size="10.5" fill="#6B7280">재생기가 멈춰도 Kafka에 남은 전날 이벤트를 Spark가 아직 처리 중일 수 있어서</text>

  <!-- 3 -->
  <circle cx="44" cy="370" r="13" fill="#1F2937"/><text x="44" y="375" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
  <path fill="none" stroke="#C2410C" stroke-width="1.6" marker-end="url(#ahO)" d="M1000,392 H662"/>
  <text x="830" y="386" text-anchor="middle" font-size="11.5" fill="#9A3412">일 배치: 그 시점의 Delta 테이블 버전을 고정해 읽기</text>
  <text x="830" y="420" text-anchor="middle" font-size="10.5" fill="#6B7280">배치 도중 들어오는 피드백 로그가 결과를 바꾸지 않게</text>

  <!-- 4 -->
  <circle cx="44" cy="462" r="13" fill="#1F2937"/><text x="44" y="467" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
  <path fill="none" stroke="#C2410C" stroke-width="1.6" marker-end="url(#ahO)" d="M1000,484 H662"/>
  <text x="830" y="478" text-anchor="middle" font-size="11.5" fill="#9A3412">피처 이력 쓰기</text>
  <path fill="none" stroke="#C2410C" stroke-width="1.6" marker-end="url(#ahO)" d="M1000,526 H832"/>
  <text x="916" y="520" text-anchor="middle" font-size="11.5" fill="#9A3412">사용자·상품 피처 공개</text>
  <path fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" d="M1000,580 H159"/>
  <text x="580" y="574" text-anchor="middle" font-size="11.5">피처 공개 뒤 재생 재개(재개를 알리는 방식은 구현 때 정한다)</text>

  <!-- 재개 -->
  <text x="166" y="658" font-size="11.5">다음 날 재생 시작</text>
  <path fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#ahB)" d="M150,690 H318"/>
  <text x="234" y="684" text-anchor="middle" font-size="11.5" fill="#1D4ED8">다음 날 이벤트 전송</text>

  <text x="30" y="745" font-size="11" fill="#6B7280">일 배치가 끝날 때까지 재생을 일시정지한다. 배치가 끝나기 전에 다음 날 재생이 진행되면 그날 추천에 전날 피처가 아닌 전전날 피처가 쓰이기 때문이다.</text>
</svg>
