<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1390 880" width="1390" height="880" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#1F2937">
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="mgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
  </defs>

  <rect x="0" y="0" width="1390" height="880" fill="#FFFFFF"/>
  <text x="20" y="38" font-size="20" font-weight="700">강의장 노트북 클러스터 배치</text>
  <text x="20" y="62" font-size="13" fill="#4B5563">팀원 PC 5대에 리눅스 가상 머신을 1대씩 두고 Kubernetes 클러스터 하나로 묶는다. 개발·시험 때는 전 구성을 올리고, AWS를 켠 기간에는 PostgreSQL, 데이터 처리, 학습을 맡는다.</text>

  <!-- 외부: 사용자, AWS S3 -->
  <rect x="120" y="84" width="200" height="44" rx="22" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="220" y="111" text-anchor="middle" font-weight="700">사용자(강의장 내부망)</text>
  <text x="20" y="150" font-size="11" fill="#1D4ED8">진입 가상 주소</text>

  <rect x="740" y="78" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="870" y="100" text-anchor="middle" font-weight="700">클라우드(AWS) 클러스터</text>
  <text x="870" y="120" text-anchor="middle" font-size="11.5" fill="#4B5563">요청 경로 · 실시간 갱신(시험·발표 때)</text>
  <text x="1014" y="100" font-size="11" fill="#B45309">VPN으로 오가는 것: Kafka 토픽 적재, 재생 행동, 일 배치 결과, DB 조회</text>
  <text x="1014" y="118" font-size="11" fill="#B45309">모델 묶음, 대체 인기 목록, 현재 버전 정보는 AWS S3로 올린다</text>

  <!-- 내부망 -->
  <line x1="120" y1="160" x2="1360" y2="160" stroke="#6B7280" stroke-width="4"/>
  <text x="1360" y="152" text-anchor="end" font-size="11.5" fill="#4B5563">강의장 내부망 · 브리지 네트워크 · 가상 머신 주소 고정</text>
  <g stroke="#6B7280" stroke-width="2">
    <line x1="238" y1="160" x2="238" y2="190"/>
    <line x1="490" y1="160" x2="490" y2="190"/>
    <line x1="742" y1="160" x2="742" y2="190"/>
    <line x1="994" y1="160" x2="994" y2="190"/>
    <line x1="1246" y1="160" x2="1246" y2="190"/>
  </g>

  <!-- 줄 이름 -->
  <g font-size="12.5" font-weight="700" fill="#374151">
    <text x="20" y="280">저장소</text>
    <text x="20" y="376">요청 처리</text>
    <text x="20" y="500">처리·학습</text>
    <text x="20" y="518">·운영</text>
  </g>
  <rect x="112" y="244" width="1258" height="72" fill="#F0FDF4" opacity="0.6"/>
  <rect x="112" y="328" width="1258" height="96" fill="#EFF6FF" opacity="0.6"/>
  <rect x="112" y="436" width="1258" height="150" fill="#FAF5FF" opacity="0.6"/>

  <!-- 노드 상자 -->
  <g fill="none" stroke="#374151" stroke-width="1.5">
    <rect x="120" y="190" width="236" height="406" rx="10"/>
    <rect x="372" y="190" width="236" height="406" rx="10"/>
    <rect x="624" y="190" width="236" height="406" rx="10"/>
    <rect x="876" y="190" width="236" height="406" rx="10"/>
    <rect x="1128" y="190" width="236" height="406" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="238" y="212" font-weight="700">PC 1</text><text x="238" y="230" font-size="11.5" fill="#4B5563">가상 머신 1대 · Kubernetes 노드</text>
    <text x="490" y="212" font-weight="700">PC 2</text><text x="490" y="230" font-size="11.5" fill="#4B5563">가상 머신 1대 · Kubernetes 노드</text>
    <text x="742" y="212" font-weight="700">PC 3</text><text x="742" y="230" font-size="11.5" fill="#4B5563">가상 머신 1대 · Kubernetes 노드</text>
    <text x="994" y="212" font-weight="700">PC 4</text><text x="994" y="230" font-size="11.5" fill="#4B5563">가상 머신 1대 · Kubernetes 노드</text>
    <text x="1246" y="212" font-weight="700">PC 5</text><text x="1246" y="230" font-size="11.5" fill="#4B5563">가상 머신 1대 · Kubernetes 노드</text>
  </g>

  <!-- 저장소 줄 -->
  <g text-anchor="middle">
    <rect x="132" y="256" width="212" height="48" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="238" y="276" font-weight="600">객체 저장소(S3 호환)</text>
    <text x="238" y="294" font-size="11" fill="#4B5563">Delta Lake · 모델 묶음 파일</text>

    <rect x="384" y="256" width="212" height="48" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="490" y="276" font-weight="600">Kafka</text>
    <text x="490" y="294" font-size="11" fill="#4B5563">행동·정제·피드백 토픽</text>

    <rect x="636" y="250" width="212" height="30" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="742" y="270" font-weight="600">Redis(온라인 피처 스토어)</text>
    <rect x="636" y="284" width="212" height="30" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="742" y="304" font-weight="600">PostgreSQL 대기 서버</text>

    <rect x="888" y="256" width="212" height="48" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="994" y="276" font-weight="600">PostgreSQL 주 서버</text>
    <text x="994" y="294" font-size="11" fill="#4B5563">상품 정보·관계표·예측 기록·사용자 계정</text>

    <rect x="1140" y="256" width="212" height="48" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="1246" y="276" font-weight="600">PostgreSQL 대기 서버</text>
    <text x="1246" y="294" font-size="11" fill="#4B5563">동기 복제 · 장애 시 넘겨받음</text>
  </g>

  <!-- 요청 처리 줄 -->
  <g text-anchor="middle" font-size="12.5">
    <rect x="132" y="340" width="212" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB"/><text x="238" y="362">진입 컨트롤러</text>

    <rect x="384" y="340" width="212" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB"/><text x="490" y="362">화면 서버(Django)</text>
    <rect x="384" y="380" width="212" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB"/><text x="490" y="402">추천·구매 전환 예측 API</text>

    <rect x="636" y="340" width="212" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB"/><text x="742" y="362">진입 컨트롤러</text>

    <rect x="888" y="340" width="212" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB"/><text x="994" y="362">화면 서버(Django)</text>
    <rect x="888" y="380" width="212" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB"/><text x="994" y="402">추천·구매 전환 예측 API</text>
  </g>

  <!-- 처리·학습·운영 줄 -->
  <g text-anchor="middle" font-size="12.5">
    <rect x="132" y="448" width="212" height="34" rx="6" fill="#F3F4F6" stroke="#4B5563"/><text x="238" y="470">Kubernetes 관리 노드</text>
    <rect x="132" y="488" width="212" height="44" rx="6" fill="#F3F4F6" stroke="#4B5563"/><text x="238" y="507">모니터링</text><text x="238" y="524" font-size="11" fill="#4B5563">Prometheus · Grafana · 알림</text>
    <rect x="132" y="538" width="212" height="34" rx="6" fill="#F5F3FF" stroke="#7C3AED"/><text x="238" y="560">MLflow</text>

    <rect x="384" y="448" width="212" height="34" rx="6" fill="#FFFBEB" stroke="#D97706"/><text x="490" y="470">Spark 실행기</text>

    <rect x="636" y="448" width="212" height="34" rx="6" fill="#FFFBEB" stroke="#D97706"/><text x="742" y="470">Spark 실행기</text>
    <rect x="636" y="488" width="212" height="34" rx="6" fill="#FFFBEB" stroke="#D97706"/><text x="742" y="510">로그 재생기</text>

    <rect x="888" y="448" width="212" height="34" rx="6" fill="#F5F3FF" stroke="#7C3AED"/><text x="994" y="470">Airflow</text>

    <rect x="1140" y="448" width="212" height="34" rx="6" fill="#FFFBEB" stroke="#D97706"/><text x="1246" y="470">Spark 실행기</text>
    <rect x="1140" y="488" width="212" height="34" rx="6" fill="#F5F3FF" stroke="#7C3AED"/><text x="1246" y="510">모델 학습</text>
  </g>

  <!-- 화살표 -->
  <path d="M120,106 H106 V357 H130" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#mb)"/>
  <line x1="1100" y1="280" x2="1138" y2="280" stroke="#059669" stroke-width="2" marker-end="url(#mgr)"/>
  <path d="M940,304 V324 H800 V316" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#mgr)"/>
  <line x1="870" y1="156" x2="870" y2="137" stroke="#D97706" stroke-width="2" marker-start="url(#mo)" marker-end="url(#mo)"/>
  <text x="882" y="151" font-size="11" fill="#B45309">VPN(사설망) · 양쪽 연결 지점 2개씩</text>

  <!-- 객체 저장소 백업 -->
  <path d="M132,296 H100 V627 H118" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mgr)"/>
  <rect x="120" y="608" width="540" height="38" rx="6" fill="#FFFFFF" stroke="#059669" stroke-dasharray="6 4"/>
  <text x="136" y="632" font-size="12" fill="#374151"><tspan font-weight="600">다른 PC 디스크로 하루 1회 백업</tspan> · 피드백 로그 표, 데모 화면 행동, MLflow 모델 파일</text>

  <!-- 배치 규칙 -->
  <rect x="20" y="660" width="1350" height="162" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="40" y="686" font-weight="700">배치 규칙</text>
  <g font-size="12.5" fill="#374151">
    <text x="40" y="710">· 저장소는 PC마다 나눠 둔다. PC 3에는 Redis와 PostgreSQL 대기 서버를 함께 두지만, PC 3이 꺼져도 PostgreSQL은 주·대기 서버가 남아 계속 동작한다.</text>
    <text x="40" y="732">· PostgreSQL 주 1대와 대기 2대는 서로 다른 PC에 두고, Kubernetes 관리 노드가 있는 PC에는 두지 않는다. 그 PC의 DB가 주 서버일 때 PC가 꺼지면 자동 전환을 지시할 곳도 함께 사라지기 때문이다.</text>
    <text x="40" y="754">· 진입 컨트롤러, 화면 서버, 추천·구매 전환 예측 API는 2개씩 서로 다른 PC에 둔다. 사용자는 두 진입 컨트롤러가 함께 갖는 가상 주소로 접속한다.</text>
    <text x="40" y="776">· AWS를 켠 기간에는 Kafka, Redis, 화면 서버, API, 판정·Redis 반영 작업은 AWS 것을 쓰고, 노트북의 같은 프로그램은 개발·시험에만 쓴다.</text>
    <text x="40" y="798">· VPN 연결 지점은 AWS와 노트북 양쪽에 2개씩, 서로 다른 서버·PC에 두어 하나가 꺼져도 연결이 이어진다.</text>
  </g>

  <!-- 범례 -->
  <g font-size="12" fill="#374151">
    <line x1="20" y1="856" x2="56" y2="856" stroke="#2563EB" stroke-width="2.5"/><text x="64" y="860">사용자 요청</text>
    <line x1="170" y1="856" x2="206" y2="856" stroke="#059669" stroke-width="2.5"/><text x="214" y="860">DB 복제</text>
    <line x1="300" y1="856" x2="336" y2="856" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4"/><text x="344" y="860">AWS와 주고받음</text>
    <rect x="460" y="847" width="18" height="18" rx="3" fill="#ECFDF5" stroke="#059669"/><text x="486" y="860">저장소</text>
    <rect x="550" y="847" width="18" height="18" rx="3" fill="#EFF6FF" stroke="#2563EB"/><text x="576" y="860">서비스</text>
    <rect x="640" y="847" width="18" height="18" rx="3" fill="#FFFBEB" stroke="#D97706"/><text x="666" y="860">수집·처리</text>
    <rect x="750" y="847" width="18" height="18" rx="3" fill="#F5F3FF" stroke="#7C3AED"/><text x="776" y="860">학습·배포</text>
    <rect x="860" y="847" width="18" height="18" rx="3" fill="#F3F4F6" stroke="#4B5563"/><text x="886" y="860">관리·운영</text>
  </g>
</svg>
