<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 660" width="1560" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#1F2937">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  </defs>
  <rect width="1560" height="660" fill="#FFFFFF"/>

  <!-- 영역 -->
  <rect x="10" y="20" width="1540" height="150" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="10" y="180" width="1540" height="240" fill="#F0F7FF" stroke="#CBD5E1"/>
  <rect x="10" y="430" width="1540" height="190" fill="#FAFAF5" stroke="#CBD5E1"/>
  <rect x="10" y="20" width="80" height="150" fill="#E2E8F0"/>
  <rect x="10" y="180" width="80" height="240" fill="#DBEAFE"/>
  <rect x="10" y="430" width="80" height="190" fill="#EEEADB"/>
  <text x="50" y="92" text-anchor="middle" font-weight="700" font-size="14">사용자</text>
  <text x="50" y="110" text-anchor="middle" font-weight="700" font-size="14">행동</text>
  <text x="50" y="292" text-anchor="middle" font-weight="700" font-size="14">화면</text>
  <text x="50" y="310" text-anchor="middle" font-weight="700" font-size="14">반응</text>
  <text x="50" y="517" text-anchor="middle" font-weight="700" font-size="14">시스템</text>
  <text x="50" y="535" text-anchor="middle" font-weight="700" font-size="14">처리</text>

  <!-- 화살표 -->
  <g fill="none" stroke="#475569" stroke-width="1.6">
    <path d="M200,125 V260 H225" marker-end="url(#ah)"/>
    <path d="M380,233 V125" marker-end="url(#ah)"/>
    <path d="M540,125 V233" marker-end="url(#ah)"/>
    <path d="M660,233 V125" marker-end="url(#ah)"/>
    <path d="M790,125 V233" marker-end="url(#ah)"/>
    <path d="M850,287 V475" marker-end="url(#ah)"/>
    <path d="M460,125 V494" marker-end="url(#ah)"/>
    <path d="M945,530 H1050" marker-end="url(#ah)"/>
    <path d="M1150,503 V398" marker-end="url(#ah)"/>
    <path d="M905,507 V235 H1045" marker-end="url(#ah)"/>
    <path d="M925,518 V305 H1045" marker-end="url(#ah)"/>
    <path d="M1255,375 H1290"/>
    <path d="M1255,305 H1290"/>
    <path d="M1255,235 H1290"/>
    <path d="M1290,375 V125" marker-end="url(#ah)"/>
    <path d="M1390,100 H1455 V280" marker-end="url(#ah)"/>
  </g>
  <path d="M590,530 H755" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahB)"/>

  <!-- 화살표 글자 -->
  <g font-size="11.5" fill="#334155">
    <text x="468" y="458">조회마다 기록 전송</text>
    <text x="672" y="520" text-anchor="middle" fill="#2563EB">처리 위치 갱신</text>
    <text x="842" y="404" text-anchor="end">짧은 간격으로 반영 확인</text>
    <text x="997" y="520" text-anchor="middle">처리됨</text>
    <text x="975" y="228" text-anchor="middle">Redis 읽기 실패</text>
    <text x="985" y="298" text-anchor="middle">대기 한도 넘김</text>
  </g>

  <!-- 사용자 행동 -->
  <g stroke="#64748B" stroke-width="1.2" fill="#FFFFFF">
    <rect x="100" y="75" width="200" height="50" rx="6"/>
    <rect x="350" y="75" width="220" height="50" rx="6"/>
    <rect x="620" y="75" width="200" height="50" rx="6"/>
    <rect x="1210" y="75" width="180" height="50" rx="6"/>
  </g>
  <text x="200" y="105" text-anchor="middle">① 홈에 처음 들어온다</text>
  <text x="460" y="105" text-anchor="middle">② 스마트폰 3개를 차례로 연다</text>
  <text x="720" y="105" text-anchor="middle">④ 홈으로 돌아간다</text>
  <text x="1300" y="105" text-anchor="middle">⑦ 추천 상품을 연다</text>

  <!-- 화면 반응 -->
  <g stroke="#3B82F6" stroke-width="1.2" fill="#FFFFFF">
    <rect x="225" y="233" width="210" height="54" rx="6"/>
    <rect x="485" y="233" width="210" height="54" rx="6"/>
    <rect x="725" y="233" width="170" height="54" rx="6"/>
  </g>
  <rect x="1045" y="212" width="210" height="46" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="1045" y="282" width="210" height="46" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="1045" y="352" width="210" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <rect x="1365" y="280" width="180" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="330" y="265" text-anchor="middle">인기 상품 추천 표시</text>
  <text x="590" y="256" text-anchor="middle">상품 상세 · 지금 상품 기준 추천</text>
  <text x="590" y="275" text-anchor="middle" font-size="11.5" fill="#475569">기록 전송을 기다리지 않음</text>
  <text x="810" y="256" text-anchor="middle">⑤ 홈 표시</text>
  <text x="810" y="275" text-anchor="middle" font-size="11.5">추천 영역 '불러오는 중'</text>
  <text x="1150" y="240" text-anchor="middle">인기 목록으로 대체 표시</text>
  <text x="1150" y="302" text-anchor="middle">이 세션의 기존 추천 표시</text>
  <text x="1150" y="319" text-anchor="middle" font-size="11.5" fill="#475569">(없으면 인기 목록)</text>
  <text x="1150" y="380" text-anchor="middle" font-weight="700">⑥ 방금 본 상품 관련 추천</text>
  <text x="1455" y="310" text-anchor="middle" font-weight="700">⑧ 상품 상세 · 목표 달성</text>

  <!-- 시스템 처리 -->
  <rect x="330" y="494" width="260" height="72" rx="6" fill="#FFFFFF" stroke="#A16207" stroke-width="1.2"/>
  <text x="460" y="516" text-anchor="middle">③ 조회 기록 → Kafka</text>
  <text x="460" y="535" text-anchor="middle">→ 검증(중복·늦음 확인)</text>
  <text x="460" y="554" text-anchor="middle">→ Redis 반영 (몇 초 걸림)</text>
  <polygon points="850,475 945,530 850,585 755,530" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="850" y="526" text-anchor="middle" font-size="12.5">마지막 조회까지</text>
  <text x="850" y="544" text-anchor="middle" font-size="12.5">처리됐나?</text>
  <rect x="1050" y="503" width="200" height="54" rx="6" fill="#FFFFFF" stroke="#A16207" stroke-width="1.2"/>
  <text x="1150" y="526" text-anchor="middle">세션 피처와 관계표로</text>
  <text x="1150" y="544" text-anchor="middle">추천 계산</text>

  <!-- 범례 -->
  <g font-size="11.5" fill="#475569">
    <line x1="100" y1="642" x2="140" y2="642" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="148" y="646">화면이 기다리지 않는 시스템 내부 갱신</text>
    <rect x="420" y="634" width="24" height="16" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
    <text x="452" y="646">시연 목표 경로</text>
    <rect x="570" y="634" width="24" height="16" rx="3" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="602" y="646">반영을 확인하지 못했을 때</text>
  </g>
</svg>
