<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" fill="#1F2937">
  <defs>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E9B4F"/></marker>
    <marker id="ahS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>
  <text x="30" y="30" font-size="15" font-weight="700">정제 토픽으로 나눠 받는 구조</text>
  <text x="30" y="50" font-size="11.5" fill="#374151">변경(측정 근거, 11-19). 이전에는 한 작업이 배치마다 Delta → Redis → Delta 순서로 써서, S3 커밋 시간이 Redis 반영을 붙잡았다.</text>

  <!-- 행동 토픽 -->
  <rect fill="#F7F7FA" stroke="#6B7280" stroke-width="1.5" x="30" y="200" width="190" height="64" rx="8"/>
  <text x="125" y="226" text-anchor="middle" font-weight="700" font-size="13.5">Kafka 행동 토픽</text>
  <text x="125" y="247" text-anchor="middle" font-size="11.5" fill="#374151">파티션 키: 사용자 ID</text>

  <!-- 판정 작업 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M220,232 H266"/>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="270" y="186" width="220" height="92" rx="8"/>
  <text x="380" y="210" text-anchor="middle" font-weight="700" font-size="13.5">Spark 판정 작업</text>
  <text x="380" y="231" text-anchor="middle" font-size="11.5" fill="#374151">스키마 검사, 중복·늦음 판정</text>
  <text x="380" y="250" text-anchor="middle" font-size="11.5" fill="#374151">버리지 않고 판정 결과를 붙임</text>
  <text x="380" y="269" text-anchor="middle" font-size="11.5" fill="#374151">판정 상태: Spark 상태 저장소</text>

  <!-- 정제 토픽 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M490,232 H536"/>
  <rect fill="#F7F7FA" stroke="#6B7280" stroke-width="1.5" x="540" y="186" width="200" height="92" rx="8"/>
  <text x="640" y="210" text-anchor="middle" font-weight="700" font-size="13.5">Kafka 정제 토픽</text>
  <text x="640" y="231" text-anchor="middle" font-size="11.5" fill="#374151">판정 결과, 원본 위치 포함</text>
  <text x="640" y="250" text-anchor="middle" font-size="11.5" fill="#374151">파티션 키: 사용자 ID</text>
  <text x="640" y="269" text-anchor="middle" font-size="11.5" fill="#374151">중복 사본이 들어올 수 있음</text>

  <!-- Redis 반영 경로 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M740,215 H770 V121 H796"/>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="800" y="80" width="200" height="82" rx="8"/>
  <text x="900" y="104" text-anchor="middle" font-weight="700" font-size="13.5">Spark Redis 반영 작업</text>
  <text x="900" y="125" text-anchor="middle" font-size="11.5" fill="#374151">짧은 간격, 수 초 목표</text>
  <text x="900" y="144" text-anchor="middle" font-size="11.5" fill="#374151">키마다 반영 위치 확인 후 적용</text>
  <path fill="none" stroke="#3E9B4F" stroke-width="1.8" marker-end="url(#ahG)" d="M1000,121 H1036"/>
  <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.5" x="1040" y="88" width="130" height="66" rx="8"/>
  <text x="1105" y="116" text-anchor="middle" font-weight="700" font-size="13.5">Redis</text>
  <text x="1105" y="137" text-anchor="middle" font-size="11.5" fill="#374151">세션 피처·구매 이력</text>

  <!-- Delta 적재 경로 -->
  <path fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahB)" d="M740,250 H770 V341 H796"/>
  <rect fill="#E3F0FF" stroke="#3B7DD8" stroke-width="1.5" x="800" y="300" width="200" height="82" rx="8"/>
  <text x="900" y="324" text-anchor="middle" font-weight="700" font-size="13.5">Spark Delta 적재 작업</text>
  <text x="900" y="345" text-anchor="middle" font-size="11.5" fill="#374151">30~60초마다 모아 쓰기</text>
  <text x="900" y="364" text-anchor="middle" font-size="11.5" fill="#374151">멱등 쓰기 옵션</text>
  <path fill="none" stroke="#3E9B4F" stroke-width="1.8" marker-end="url(#ahG)" d="M1000,341 H1036"/>
  <rect fill="#E4F5E5" stroke="#3E9B4F" stroke-width="1.5" x="1040" y="292" width="130" height="98" rx="8"/>
  <text x="1105" y="316" text-anchor="middle" font-weight="700" font-size="13.5">Delta(S3)</text>
  <text x="1105" y="337" text-anchor="middle" font-size="11.5" fill="#374151">원본</text>
  <text x="1105" y="355" text-anchor="middle" font-size="11.5" fill="#374151">정제(판정 포함)</text>
  <text x="1105" y="373" text-anchor="middle" font-size="11.5" fill="#374151">실시간 피처 이력</text>

  <!-- 원본 복사 -->
  <path fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahS)" d="M125,264 V420 H900 V386"/>
  <text x="500" y="412" text-anchor="middle" font-size="11.5" fill="#374151">원본 복사(판정 전의 모든 이벤트)</text>

  <!-- 실패 격리 -->
  <rect fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" x="30" y="446" width="1140" height="96" rx="8"/>
  <text x="46" y="468" font-weight="700" font-size="12.5">실패 격리와 중복 사본</text>
  <text x="46" y="490" font-size="11.5">Redis가 멈추면 위 경로만 멈추고 Delta 적재는 계속된다. S3만 느리거나 끊기면 아래 경로만 멈춘다. 판정 작업이나 강의장 인터넷 전체가 멈추면 둘 다 멈춘다.</text>
  <text x="46" y="510" font-size="11.5">두 작업은 정제 토픽의 중복 사본을 같은 규칙(원본 위치 기준, 가장 앞선 오프셋, 판정 배치 단위로 상태 정리)으로 거른다. 그래서 값과 리비전이 같다.</text>
  <text x="46" y="530" font-size="11.5">피처 리비전: 그 세션 키에 마지막으로 반영한 행동 토픽 위치(처리 위치는 따로 둔다). 두 작업은 서로 기다리지 않으며 Redis가 Delta보다 앞서 있는 것이 정상이다.</text>
</svg>
