services:
  db:
    image: ${MARIADB_IMAGE:?Set MARIADB_IMAGE in .env}
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --port=3311
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:?Set NEXTCLOUD_IMAGE in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      MYSQL_HOST: "db:3311"
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in .env}
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1"
    secrets:
      - db_password
      - admin_password
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - frontend
      - backend
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          $$status = json_decode((string) @file_get_contents('http://127.0.0.1/status.php'), true);
          exit(!empty($$status['installed']) && empty($$status['maintenance']) && empty($$status['needsDbUpgrade']) ? 0 : 1);
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  cron:
    image: ${NEXTCLOUD_IMAGE:?Set NEXTCLOUD_IMAGE in .env}
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - backend
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      nextcloud:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  nextcloud_data:
  db_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
