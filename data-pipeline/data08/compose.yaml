services:
  postgres:
    image: ${DATA08_POSTGRES_IMAGE:-postgres:18.7}
    environment:
      POSTGRES_DB: catalog
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "catalog"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - catalog18:/var/lib/postgresql
volumes:
  catalog18:
