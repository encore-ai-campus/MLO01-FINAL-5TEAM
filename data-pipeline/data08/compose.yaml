services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: catalog
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - catalog:/var/lib/postgresql/data
volumes:
  catalog:
